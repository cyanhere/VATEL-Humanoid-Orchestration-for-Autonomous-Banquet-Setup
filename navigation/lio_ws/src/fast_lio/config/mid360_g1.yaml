# FAST-LIO2 for Unitree G1 + Livox Mid-360.  [measured] = from this robot.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.3
        filter_size_map: 0.3
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./g1_map.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            # [measured] imu stamp +0.6 ms vs host, lidar +103 ms (one accumulation
            # window). Both come from the lidar's own clock and are already mutually
            # synchronised - enabling this would fight a sync that exists.
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1          # Livox CustomMsg -> driver MUST run xfer_format:=1
            scan_line: 4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10          # [measured] 10.00 Hz, jitter std 0.34 ms

        mapping:
            acc_cov: 0.2           # [measured] gait accel std 0.49 g vs 0.05 g static
            gyr_cov: 0.15          # [measured] gyro mean 0.43 rad/s, max 5.7
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree: 360.0
            det_range: 40.0
            # The Mid-360's IMU is INSIDE the lidar, so this is fixed and known.
            # [measured] IMU gravity correctly predicts the lidar's floor plane,
            # so the streams already agree. Online estimation would add a free
            # parameter that can drift.
            extrinsic_est_en: false
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:
            path_en: false   # was true - /path, 0 subscribers
            effect_map_en: false
            map_en: false   # was true - /Laser_map, 1.315 MB/s, 0 subscribers
            scan_publish_en: true
            dense_publish_en: false
            scan_bodyframe_pub_en: false   # was true - /cloud_registered_body, 1.299 MB/s, 0 subscribers
        pcd_save:
            pcd_save_en: false     # true only when building a map to localize against
            interval: -1
